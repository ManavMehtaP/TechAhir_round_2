<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Live Auctions</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e8eaf0;--muted:#8b93a7;--accent:#6ea8fe;--good:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .box{width:100%;max-width:400px}
  h1{font-size:26px;text-align:center;margin:0 0 6px;letter-spacing:.3px} h1 span{color:var(--accent)}
  .sub{text-align:center;color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{background:transparent;color:var(--muted);border:0;padding:9px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#08111f}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:8px;outline:none;font:inherit;margin-bottom:14px}
  input:focus{border-color:var(--accent)}
  .go{width:100%;background:var(--accent);color:#08111f;border:0;padding:12px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
  .go:disabled{opacity:.5;cursor:wait}
  .msg{min-height:20px;margin-top:12px;font-size:13.5px;text-align:center} .msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
  .hint{font-size:12px;color:var(--muted);margin:-8px 0 14px}
</style>
</head>
<body>
<div class="box">
  <h1>Live<span>Auctions</span></h1>
  <p class="sub">Sign in to bid and create auctions</p>
  <div class="card">
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">Sign in</button>
      <button id="tabReg" type="button">Create account</button>
    </div>
    <form id="form">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" required minlength="3" maxlength="32" autofocus>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <div class="hint" id="hint" hidden>Username: 3-32 letters, digits or underscore. Password: at least 8 characters.</div>
      <button class="go" id="go" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'login';

// Already signed in with a valid token? Go straight to the app.
(async () => {
  const t = localStorage.getItem('token');
  if (!t) return;
  try {
    const r = await fetch('/auth/me', {headers: {Authorization: 'Bearer ' + t}});
    if (r.ok) location.replace('/');
    else { localStorage.removeItem('token'); localStorage.removeItem('username'); }
  } catch (e) {}
})();

function setMode(m){
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabReg').classList.toggle('on', m === 'register');
  $('go').textContent = m === 'login' ? 'Sign in' : 'Create account';
  $('hint').hidden = m === 'login';
  $('p').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('p').minLength = m === 'login' ? 1 : 8;
  $('msg').textContent = '';
}
$('tabLogin').onclick = () => setMode('login');
$('tabReg').onclick = () => setMode('register');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), go = $('go');
  msg.className = 'msg'; msg.textContent = '';
  go.disabled = true;
  try {
    const r = await fetch(mode === 'login' ? '/auth/login' : '/auth/register', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({username: $('u').value.trim(), password: $('p').value})
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      let text = body.detail;
      if (Array.isArray(text)) text = text.map(d => d.msg).join('; ');      // validation errors
      msg.className = 'msg err'; msg.textContent = text || 'Something went wrong';
      return;
    }
    localStorage.setItem('token', body.token);
    localStorage.setItem('username', body.user.username);
    msg.className = 'msg ok'; msg.textContent = 'Success, redirecting…';
    location.replace('/');
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'Cannot reach the server';
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
